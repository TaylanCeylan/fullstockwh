<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Cart - Fullstockwh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f8f9fa; }
        .cart-item-img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            background-color: #e9ecef;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #adb5bd;
        }
        .qty-btn { width: 32px; height: 32px; padding: 0;
           display: flex; align-items: center; justify-content: center; }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5 mb-5">
    <h2 class="fw-bold mb-4">Shopping Cart</h2>

    <div th:if="${cart.items == null or cart.items.isEmpty()}" class="text-center py-5 bg-white rounded shadow-sm">
        <i class="bi bi-cart-x display-1 text-muted mb-3"></i>
        <h3>Your cart is empty</h3>
        <p class="text-muted">You haven't added anything to your cart yet.</p>
        <a th:href="@{/}" class="btn btn-dark mt-3 px-4 py-2">Start Shopping</a>
    </div>

    <div th:if="${cart.items != null and !cart.items.isEmpty()}" class="row g-4">

        <div class="col-lg-8">
            <div class="card border-0 shadow-sm">
                <div class="card-body p-4">

                    <div th:each="item : ${cart.items}"
                         class="row align-items-center border-bottom py-3 mb-2"
                         th:id="'item-row-' + ${item.variantId}">

                        <div class="col-2">
                            <div class="cart-item-img">
                                <i class="bi bi-image fs-3"></i>
                            </div>
                        </div>

                        <div class="col-5">
                            <h6 class="fw-bold mb-1" th:text="${item.productName}">Product</h6>
                            <p class="text-muted mb-0 small">
                                <span th:text="${item.color}">Color</span> /
                                <span th:text="${item.size}">Size</span>
                            </p>
                            <small class="text-muted"
                                   th:text="${'Stock: ' + item.stockQuantity}"></small>
                        </div>

                        <div class="col-3 text-center">
                            <div class="d-flex align-items-center justify-content-center gap-2">

                                <button class="btn btn-outline-secondary qty-btn btn-minus"
                                        th:disabled="${item.quantity <= 1}"
                                        th:attr="data-variant-id=${item.variantId},
                                            data-current=${item.quantity},
                                            data-max=${item.stockQuantity}">
                                    <i class="bi bi-dash"></i>
                                </button>

                                <span class="fw-bold fs-6 px-2"
                                      th:id="'qty-' + ${item.variantId}"
                                      th:text="${item.quantity}">1</span>

                                <button class="btn btn-outline-secondary qty-btn btn-plus"
                                        th:disabled="${item.quantity >= item.stockQuantity}"
                                        th:attr="data-variant-id=${item.variantId},
                                            data-current=${item.quantity},
                                            data-max=${item.stockQuantity}">
                                    <i class="bi bi-plus"></i>
                                </button>

                            </div>
                        </div>

                        <div class="col-2 text-end">
                            <span class="fw-bold"
                                  th:id="'subtotal-' + ${item.variantId}"
                                  th:text="${'₺' + item.subtotal}">₺0</span>
                        </div>

                        <div class="col-1 text-end">
                            <form th:action="@{/cart/remove}" method="post" class="m-0">
                                <input type="hidden" name="variantId" th:value="${item.variantId}">
                                <button type="submit" class="btn btn-outline-danger btn-sm qty-btn">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </div>
                    </div>

                </div>
            </div>
        </div>

        <div class="col-lg-4">
            <div class="card border-0 shadow-sm bg-dark text-white">
                <div class="card-body p-4">
                    <h4 class="fw-bold mb-4">Order Summary</h4>

                    <div class="d-flex justify-content-between mb-3">
                        <span>Total Items</span>
                        <span th:text="${cart.totalItems}">0</span>
                    </div>

                    <hr class="border-secondary">

                    <div class="d-flex justify-content-between mb-4 mt-3">
                        <span class="fs-5">Total</span>
                        <span class="fs-5 fw-bold text-success"
                              id="cartTotal"
                              th:text="${'₺' + cart.totalAmount}">₺0.00</span>
                    </div>

                    <a th:href="@{/checkout/shipping}" class="btn btn-light w-100 py-3 fw-bold">
                        Proceed to Checkout
                    </a>

                    <a th:href="@{/}" class="btn btn-outline-light w-100 mt-2 py-2">Continue Shopping</a>
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
    document.addEventListener('DOMContentLoaded', function () {

        document.querySelectorAll('.btn-minus, .btn-plus').forEach(function (btn) {
            btn.addEventListener('click', function () {
                const variantId = parseInt(this.dataset.variantId);
                const current = parseInt(this.dataset.current);
                const max = parseInt(this.dataset.max);
                const isMinus = this.classList.contains('btn-minus');
                const newQty = isMinus ? current - 1 : current + 1;

                if (newQty < 1 || newQty > max) return;

                fetch('/cart/update', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ variantId: variantId, quantity: newQty })
                })
                .then(function (res) { return res.json(); })
                .then(function (data) {
                    document.getElementById('qty-' + variantId).textContent = newQty;
                    document.getElementById('subtotal-' + variantId).textContent
                        = '₺' + data.itemSubtotal.toFixed(2);
                    document.getElementById('cartTotal').textContent
                        = '₺' + data.cartTotal.toFixed(2);

                    const row = document.getElementById('item-row-' + variantId);
                    row.querySelectorAll('.btn-minus, .btn-plus').forEach(function (b) {
                        b.dataset.current = newQty;
                    });
                    row.querySelector('.btn-minus').disabled = newQty <= 1;
                    row.querySelector('.btn-plus').disabled  = newQty >= max;
                });
            });
        });
    });
</script>

</body>
</html>
