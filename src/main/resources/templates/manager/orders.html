<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Manager - Orders</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; }
    .sidebar { width: 280px; height: 100vh; position: fixed; left: 0; top: 0; background-color: #343a40; z-index: 1000; }
    .main-content { margin-left: 280px; padding: 40px; min-height: 100vh; }
    .card { border: none; border-radius: 12px; }
  </style>
</head>
<body>

<div th:replace="~{manager/sidebar :: managerSidebar}"></div>

<div class="main-content">
  <div class="container-fluid" style="max-width:1300px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold mb-0">Orders</h3>
      <div th:if="${success}" class="alert alert-success mb-0 py-2" th:text="${success}"></div>
      <div th:if="${error}" class="alert alert-danger mb-0 py-2" th:text="${error}"></div>
      <span class="text-muted" th:text="${allOrders != null ? #lists.size(allOrders) : 0} + ' total orders'"></span>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body py-3">
        <form th:action="@{/manager/orders}" method="get" class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label fw-semibold">Search</label>
            <input type="text" name="search" class="form-control"
                   placeholder="Customer name or email..."
                   th:value="${search}">
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold">Status</label>
            <select name="status" class="form-select">
              <option value="" th:selected="${selectedStatus == null or selectedStatus == ''}">All</option>
              <option value="PENDING"   th:selected="${selectedStatus == 'PENDING'}">Pending</option>
              <option value="SUCCESS"   th:selected="${selectedStatus == 'SUCCESS'}">Confirmed</option>
              <option value="SHIPPED"   th:selected="${selectedStatus == 'SHIPPED'}">Shipped</option>
              <option value="DELIVERED" th:selected="${selectedStatus == 'DELIVERED'}">Delivered</option>
              <option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">Cancelled</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold">Sort By</label>
            <select name="sortBy" class="form-select">
              <option value="date"  th:selected="${sortBy == 'date'}">Date</option>
              <option value="total" th:selected="${sortBy == 'total'}">Total</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold">Order</label>
            <select name="direction" class="form-select">
              <option value="desc" th:selected="${direction == 'desc'}">↓ Newest</option>
              <option value="asc"  th:selected="${direction == 'asc'}">↑ Oldest</option>
            </select>
          </div>
          <div class="col-md-1">
            <button type="submit" class="btn btn-dark w-100">Filter</button>
          </div>
          <div class="col-md-1">
            <a th:href="@{/manager/orders}" class="btn btn-outline-secondary w-100">Reset</a>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div th:if="${allOrders == null or #lists.isEmpty(allOrders)}" class="text-center text-muted py-5">
          No orders found.
        </div>
        <div th:if="${allOrders != null and not #lists.isEmpty(allOrders)}" class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
              <th class="ps-4">#</th>
              <th>Customer</th>
              <th>E-mail</th>
              <th>Quantity</th>
              <th>Total</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="order : ${allOrders}">
              <td class="ps-4 fw-semibold text-muted" th:text="'#' + ${order.id}"></td>
              <td th:text="${order.user != null ? order.user.firstName + ' ' + order.user.lastName : 'Guest'}"></td>
              <td class="text-muted" th:text="${order.user != null ? order.user.username : '-'}"></td>
              <td><span class="badge bg-light text-dark border" th:text="${order.totalQuantity} + ' pieces'"></span></td>
              <td class="fw-semibold" th:text="${#numbers.formatDecimal(order.totalPrice, 1, 2) + '₺'}"></td>
              <td>
                                <span th:switch="${order.status.name()}">
                                    <span th:case="'SUCCESS'" class="badge bg-success">Confirmed</span>
                                    <span th:case="'PENDING'" class="badge bg-warning text-dark">Pending</span>
                                    <span th:case="'SHIPPED'" class="badge bg-primary">Shipped</span>
                                    <span th:case="'DELIVERED'" class="badge bg-info text-dark">Delivered</span>
                                    <span th:case="'CANCELLED'" class="badge bg-secondary">Cancelled</span>
                                </span>
              </td>
              <td class="text-muted" th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}"></td>
              <td>
                <a th:href="@{/manager/orders/{id}(id=${order.id})}"
                   class="btn btn-sm btn-outline-secondary me-1">Detail</a>
                <a th:if="${order.status.name() == 'SUCCESS'}"
                   th:href="@{/manager/orders/{id}/ship(id=${order.id})}"
                   class="btn btn-sm btn-dark">Ship Order</a>
                <form th:if="${order.status.name() == 'SHIPPED'}"
                      th:action="@{/manager/orders/{id}/deliver(id=${order.id})}"
                      method="post" class="d-inline">
                  <button type="submit" class="btn btn-sm btn-success">Mark Delivered</button>
                </form>
                <span th:if="${order.status.name() == 'DELIVERED'}" class="text-muted small">Completed</span>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
