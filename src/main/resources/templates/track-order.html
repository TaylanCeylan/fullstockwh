<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Track Order - Fullstockwh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { background-color: #f8f9fa; }
        #trackMap { height: 320px; border-radius: 12px; }
        .timeline-step  { display: flex; align-items: flex-start; gap: 16px; margin-bottom: 24px; }
        .step-icon {
            width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0;
            display: flex; align-items: center; justify-content: center; font-size: 1.1rem;
        }
        .step-done    { background: #198754; color: #fff; }
        .step-pending { background: #dee2e6; color: #6c757d; }
        .step-line    { width: 2px; height: 32px; background: #dee2e6; margin-left: 19px; }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5 mb-5" style="max-width: 800px;">

    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/orders}" class="btn btn-outline-secondary btn-sm">
            <i class="bi bi-arrow-left me-1"></i>Back to Orders
        </a>
        <h3 class="fw-bold mb-0">
            Order Tracking
            <span class="text-muted fs-5 fw-normal" th:text="'#' + ${orderId}"></span>
        </h3>
    </div>

    <div th:if="${error}" class="alert alert-warning" th:text="${error}"></div>

    <div th:if="${tracking != null}">


        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <div class="row g-3">
                    <div class="col-sm-6">
                        <div class="text-muted small">Tracking Number</div>
                        <div class="fw-bold fs-5 font-monospace" th:text="${tracking.trackingNumber}"></div>
                    </div>
                    <div class="col-sm-6">
                        <div class="text-muted small">Carrier</div>
                        <div class="fw-semibold" th:text="${tracking.carrierName}"></div>
                    </div>
                    <div class="col-sm-6">
                        <div class="text-muted small">Delivery Address</div>
                        <div th:text="${tracking.destinationDistrict + ', ' + tracking.destinationCity}"></div>
                    </div>
                    <div class="col-sm-6">
                        <div class="text-muted small">Estimated Delivery</div>
                        <div class="fw-semibold text-success"
                             th:text="${tracking.estimatedDelivery != null
                                ? #temporals.format(tracking.estimatedDelivery, 'dd MMM yyyy')
                                : '-'}">
                        </div>
                    </div>
                    <div class="col-sm-6" th:if="${tracking.distanceKm != null and tracking.distanceKm > 0}">
                        <div class="text-muted small">Distance</div>
                        <div th:text="${#numbers.formatDecimal(tracking.distanceKm, 1, 1) + ' km'}"></div>
                    </div>
                    <div class="col-sm-6" th:if="${tracking.shippingFee != null}">
                        <div class="text-muted small">Shipping Fee</div>
                        <div th:text="${'₺' + #numbers.formatDecimal(tracking.shippingFee, 1, 2)}"></div>
                    </div>
                </div>
            </div>
        </div>


        <div class="card border-0 shadow-sm mb-4">
            <div class="card-body p-4">
                <h6 class="fw-bold mb-4">Shipment Status</h6>


                <div class="timeline-step">
                    <div class="step-icon step-done"><i class="bi bi-check-lg"></i></div>
                    <div>
                        <div class="fw-semibold">Order Confirmed</div>
                        <div class="text-muted small"
                             th:text="${tracking.orderedAt != null
                                ? #temporals.format(tracking.orderedAt, 'dd MMM yyyy HH:mm') : ''}">
                        </div>
                    </div>
                </div>
                <div class="step-line"></div>


                <div class="timeline-step">
                    <div th:class="${tracking.shipmentStatus.name() == 'SHIPPED'
                                   or tracking.shipmentStatus.name() == 'DELIVERED'}
                                   ? 'step-icon step-done' : 'step-icon step-pending'">
                        <i class="bi bi-box-seam"></i>
                    </div>
                    <div>
                        <div class="fw-semibold">Shipped</div>
                        <div class="text-muted small"
                             th:text="${tracking.shippedAt != null
                                ? #temporals.format(tracking.shippedAt, 'dd MMM yyyy HH:mm')
                                : 'Pending'}">
                        </div>
                    </div>
                </div>
                <div class="step-line"></div>


                <div class="timeline-step">
                    <div th:class="${tracking.shipmentStatus.name() == 'DELIVERED'}
                                   ? 'step-icon step-done' : 'step-icon step-pending'">
                        <i class="bi bi-house-check"></i>
                    </div>
                    <div>
                        <div class="fw-semibold">Delivered</div>
                        <div class="text-muted small"
                             th:text="${tracking.deliveredAt != null
                                ? #temporals.format(tracking.deliveredAt, 'dd MMM yyyy HH:mm')
                                : 'Pending'}">
                        </div>
                    </div>
                </div>

            </div>
        </div>


        <div class="card border-0 shadow-sm">
            <div class="card-body p-3">
                <h6 class="fw-bold mb-3">Shipment Map</h6>
                <div id="trackMap"></div>
                <div class="text-muted small mt-2">
                    Blue: Ankara Central Warehouse | Red: Delivery Area
                </div>
            </div>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script th:if="${tracking != null}" th:inline="javascript">

    const warehouseLat = 39.9334;
    const warehouseLon = 32.8597;
    const destLat      = /*[[${tracking.destinationLat ?: 39.9334}]]*/ 39.9334;
    const destLon      = /*[[${tracking.destinationLon ?: 32.8597}]]*/ 32.8597;

    const map = L.map('trackMap').setView(
        [(warehouseLat + destLat) / 2, (warehouseLon + destLon) / 2], 6
    );

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    const blueIcon = L.divIcon({
        html: '<div style="background:#0d6efd;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.3)"></div>',
        iconSize: [14, 14], iconAnchor: [7, 7]
    });
    L.marker([warehouseLat, warehouseLon], { icon: blueIcon })
     .addTo(map).bindPopup('Fullstockwh Central Warehouse');

    const redIcon = L.divIcon({
        html: '<div style="background:#dc3545;width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 4px rgba(0,0,0,.3)"></div>',
        iconSize: [14, 14], iconAnchor: [7, 7]
    });
    L.marker([destLat, destLon], { icon: redIcon })
     .addTo(map).bindPopup('Delivery Address');

    L.polyline([[warehouseLat, warehouseLon], [destLat, destLon]], {
        color: '#0d6efd', weight: 2, dashArray: '6,8'
    }).addTo(map);

    map.fitBounds([[warehouseLat, warehouseLon], [destLat, destLon]], { padding: [40, 40] });

</script>

</body>
</html>
