<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Orders - Fullstockwh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style> body { background-color: #f8f9fa; } </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5 mb-5">
    <h2 class="fw-bold mb-4">My Orders</h2>


    <div th:if="${orders.isEmpty()}"
         class="text-center py-5 bg-white rounded shadow-sm">
        <i class="bi bi-bag-x display-1 text-muted mb-3"></i>
        <h4>No orders yet</h4>
        <p class="text-muted">You haven't placed any orders yet.</p>
        <a th:href="@{/}" class="btn btn-dark mt-3">Start Shopping</a>
    </div>


    <div th:each="order : ${orders}" class="card border-0 shadow-sm mb-4">


        <div class="card-header bg-white d-flex justify-content-between align-items-center py-3">
            <div>
                <span class="fw-bold me-3">
                    Order #<span th:text="${order.id}"></span>
                </span>
                <span class="text-muted small"
                      th:text="${#temporals.format(order.orderDate, 'dd MMM yyyy HH:mm')}">
                </span>
            </div>
            <div class="d-flex align-items-center gap-3">
    <span th:switch="${order.status.name()}">
        <span th:case="'SUCCESS'"   class="badge bg-success">Confirmed</span>
        <span th:case="'PENDING'"   class="badge bg-warning text-dark">Pending</span>
        <span th:case="'FAILED'"    class="badge bg-danger">Failed</span>
        <span th:case="'SHIPPED'"   class="badge bg-primary">Shipped</span>
        <span th:case="'DELIVERED'" class="badge bg-info text-dark">Delivered</span>
        <span th:case="'CANCELLED'" class="badge bg-secondary">Cancelled</span>
    </span>

                <span class="fw-bold text-success"
                      th:text="${'₺' + order.totalPrice}">₺0</span>

                <a th:if="${order.status.name() == 'SHIPPED' or order.status.name() == 'DELIVERED'}"
                   th:href="@{'/orders/' + ${order.id} + '/track'}"
                   class="btn btn-sm btn-outline-dark">
                    <i class="bi bi-geo-alt me-1"></i>Track Order
                </a>
            </div>
        </div>


        <div class="card-body p-0">
            <table class="table table-hover mb-0">
                <thead class="table-light text-muted small">
                <tr>
                    <th class="ps-4">Product</th>
                    <th>Color / Size</th>
                    <th>Qty</th>
                    <th>Price at Purchase</th>
                    <th>Subtotal</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="item : ${order.items}">
                    <td class="ps-4 fw-semibold"
                        th:text="${item.productName}">Product</td>
                    <td class="text-muted small">
                        <span th:text="${item.color}"></span> /
                        <span th:text="${item.size}"></span>
                    </td>
                    <td th:text="${item.quantity}">1</td>
                    <td th:text="${'₺' + item.priceAtPurchase}">₺0</td>
                    <td class="fw-bold"
                        th:text="${'₺' + item.subtotal}">₺0</td>
                </tr>
                </tbody>
            </table>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
