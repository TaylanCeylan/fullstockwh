<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed - Fullstockwh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style> body { background-color: #f8f9fa; } </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5" style="max-width: 600px;">

    <div class="d-flex align-items-center gap-2 mb-4">
        <div style="width:36px;height:36px;border-radius:50%;background:#198754;color:#fff;
                display:flex;align-items:center;justify-content:center;font-weight:700;">
            <i class="bi bi-cart-fill"></i>
        </div>
        <div style="flex:1;height:2px;background:#198754;"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#198754;color:#fff;
                display:flex;align-items:center;justify-content:center;font-weight:700;">
            1
        </div>
        <div style="flex:1;height:2px;background:#198754;"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#198754;color:#fff;
                display:flex;align-items:center;justify-content:center;font-weight:700;">
            2
        </div>
        <div style="flex:1;height:2px;background:#198754;"></div>
        <div style="width:36px;height:36px;border-radius:50%;background:#198754;color:#fff;
                display:flex;align-items:center;justify-content:center;font-weight:700;">
            <i class="bi bi-check-lg"></i>
        </div>
    </div>

    <div class="card border-0 shadow-sm p-5 text-center">

        <i class="bi bi-check-circle-fill text-success display-1 mb-4"></i>
        <h2 class="fw-bold mb-2">Order Confirmed!</h2>

        <p class="text-muted mb-1">
            Order #<strong th:text="${orderId}">—</strong>
        </p>
        <p class="text-muted mb-4">
            Total paid:
            <strong class="text-success"
                    th:text="${'₺' + orderTotal}">₺0.00</strong>
        </p>

        <p class="text-muted small mb-4">
            Thank you for your purchase. Your order is being processed.
        </p>

        <div class="d-flex gap-3 justify-content-center">
            <a th:href="@{/orders}" class="btn btn-dark px-4">
                <i class="bi bi-bag me-2"></i>View My Orders
            </a>
            <a th:href="@{/}" class="btn btn-outline-dark px-4">
                <i class="bi bi-shop me-2"></i>Continue Shopping
            </a>
        </div>

    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
