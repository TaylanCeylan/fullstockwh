<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .sidebar { width: 280px; height: 100vh; position: fixed; left: 0; top: 0; background-color: #343a40; z-index: 1000; }
        .main-content { margin-left: 280px; padding: 40px; min-height: 100vh; }
        .container-fluid { max-width: 1300px; }
        .error-text { color: #dc3545; font-size: 0.8rem; margin-top: 4px; }
        .card { border: none; border-radius: 12px; transition: all 0.3s; }
        .card-header { border-radius: 12px 12px 0 0 !important; font-weight: 600; }
        .table align-middle td { vertical-align: middle; }
    </style>
</head>
<body>

<div >
    <div th:replace="~{admin/sidebar :: adminSidebar}"></div>

    <div class="main-content">
        <div class="container-fluid">
            <div class="row">
                <div class="col-md-4 mb-4">
                    <div class="card card-stat bg-primary text-white shadow">
                        <div class="card-body py-4">
                            <h6 class="text-uppercase opacity-75">Total Products</h6>
                            <h1 class="display-5 fw-bold" th:text="${totalProducts ?: '0'}">0</h1>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-4">
                    <div class="card card-stat bg-success text-white shadow">
                        <div class="card-body py-4">
                            <h6 class="text-uppercase opacity-75">Total Stock</h6>
                            <h1 class="display-5 fw-bold" th:text="${totalStock ?: '0'}">0</h1>
                        </div>
                    </div>
                </div>

                <div class="col-md-4 mb-4">
                    <div class="card card-stat bg-warning text-dark shadow">
                        <div class="card-body py-4">
                            <h6 class="opacity-75">TOTAL CATEGORIES</h6>
                            <h1 class="display-5 fw-bold" th:text="${totalCategories ?: '0'}">0</h1>
                        </div>
                    </div>
                </div>
            </div>
            <div class="row mt-4">
                <div class="col-12">
                    <div class="card border-0 shadow-sm">
                        <div class="card-header bg-white py-3">
                            <h5 class="card-title mb-0 fw-bold">Category Bar chart</h5>
                        </div>
                        <div class="card-body">
                            <div style="position: relative; height: 400px; width: 100%;">
                                <canvas id="categoryChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="row mt-4">
                    <div class="col-12">
                        <div class="card border-0 shadow-sm">
                            <div class="card-header bg-white py-3 d-flex justify-content-between align-items-center">
                                <h5 class="card-title mb-0 fw-bold">Last 10 Orders</h5>
                                <span class="badge bg-secondary" th:text="${recentOrders != null ? #lists.size(recentOrders) : 0} + ' orders'">0 orders</span>
                            </div>
                            <div class="card-body p-0">
                                <div th:if="${recentOrders == null or #lists.isEmpty(recentOrders)}" class="text-center text-muted py-5">
                                    <p class="mb-0">No orders yet.</p>
                                </div>
                                <div th:if="${recentOrders != null and not #lists.isEmpty(recentOrders)}" class="table-responsive">
                                    <table class="table table-hover align-middle mb-0">
                                        <thead class="table-light">
                                        <tr>
                                            <th class="ps-4">#</th>
                                            <th>Customer</th>
                                            <th>Products</th>
                                            <th>Total</th>
                                            <th>Status</th>
                                            <th>Date</th>
                                        </tr>
                                        </thead>
                                        <tbody>
                                        <tr th:each="order : ${recentOrders}">
                                            <td class="ps-4 fw-semibold text-muted" th:text="'#' + ${order.id}"></td>
                                            <td>
                                                <span th:text="${order.user != null ? order.user.firstName + ' ' + order.user.lastName : 'Guest'}"></span>
                                            </td>
                                            <td>
                                                <span class="text-muted" th:text="${order.totalQuantity} + ' pieces'"></span>
                                            </td>
                                            <td class="fw-semibold" th:text="${#numbers.formatDecimal(order.totalPrice, 1, 2) + '₺'}"></td>
                                            <td>
                                                <span th:switch="${order.status.name()}">
                                                    <span th:case="'SUCCESS'" class="badge bg-success">Success</span>
                                                    <span th:case="'PENDING'" class="badge bg-warning text-dark">Pending</span>
                                                    <span th:case="'FAILED'" class="badge bg-danger">Failed</span>
                                                    <span th:case="*" class="badge bg-secondary" th:text="${order.status}"></span>
                                                </span>
                                            </td>
                                            <td class="text-muted" th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}"></td>
                                        </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script th:inline="javascript">
        const categoryStats = [[${categoryStats}]];

        const labels = Object.keys(categoryStats);
        const data = Object.values(categoryStats);

        const ctx = document.getElementById('categoryChart').getContext('2d');

        new Chart(ctx, {
            type: 'bar',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Product Counts',
                    data: data,
                    backgroundColor: 'rgba(52, 152, 219, 0.7)',
                    borderColor: 'rgba(52, 152, 219, 1)',
                    borderWidth: 1,
                    borderRadius: 5
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: {
                        beginAtZero: true,
                        ticks: {
                            stepSize: 1
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false
                    }
                }
            }
        });
    </script>
</body>
</html>
