<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Orders</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f7f6; }
        .sidebar { width: 280px; height: 100vh; position: fixed; left: 0; top: 0; background-color: #343a40; z-index: 1000; }
        .main-content { margin-left: 280px; padding: 40px; min-height: 100vh; }
        .container-fluid { max-width: 1300px; }
        .card { border: none; border-radius: 12px; }
        .card-header { border-radius: 12px 12px 0 0 !important; font-weight: 600; }
        .badge { font-size: 0.8rem; padding: 0.45em 0.75em; }
    </style>
</head>
<body>

<div>
    <div th:replace="~{admin/sidebar :: adminSidebar}"></div>

    <div class="main-content">
        <div class="container-fluid">

            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3 class="fw-bold mb-0">Orders</h3>
                <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
                <div th:if="${error}"   class="alert alert-danger"  th:text="${error}"></div>
                <span class="text-muted" th:text="${allOrders != null ? #lists.size(allOrders) : 0} + ' total orders'"></span>
            </div>

            <div class="card shadow-sm mb-4">
                <div class="card-body py-3">
                    <form th:action="@{/admin/orders}" method="get" class="row g-3 align-items-end">
                        <div class="col-md-4">
                            <label class="form-label fw-semibold">Status</label>
                            <select name="status" class="form-select">
                                <option value="" th:selected="${selectedStatus == null or selectedStatus == ''}">All</option>
                                <option value="PENDING"  th:selected="${selectedStatus == 'PENDING'}">Pending</option>
                                <option value="SUCCESS"  th:selected="${selectedStatus == 'SUCCESS'}">Success</option>
                                <option value="FAILED"   th:selected="${selectedStatus == 'FAILED'}">Failed</option>
                                <option value="SHIPPED"   th:selected="${selectedStatus == 'SHIPPED'}">Shipped</option>
                                <option value="DELIVERED" th:selected="${selectedStatus == 'DELIVERED'}">Delivered</option>
                                <option value="CANCELLED" th:selected="${selectedStatus == 'CANCELLED'}">Cancelled</option>
                            </select>
                        </div>
                        <div class="col-md-3">
                            <button type="submit" class="btn btn-dark w-100">Filter</button>
                        </div>
                        <div class="col-md-2">
                            <a th:href="@{/admin/orders}" class="btn btn-outline-secondary w-100">Reset</a>
                        </div>
                    </form>
                </div>
            </div>

            <div class="card shadow-sm">
                <div class="card-body p-0">
                    <div th:if="${allOrders == null or #lists.isEmpty(allOrders)}" class="text-center text-muted py-5">
                        <p class="mb-0">No orders yet.</p>
                    </div>
                    <div th:if="${allOrders != null and not #lists.isEmpty(allOrders)}" class="table-responsive">
                        <table class="table table-hover align-middle mb-0">
                            <thead class="table-light">
                            <tr>
                                <th class="ps-4">#</th>
                                <th>Customer</th>
                                <th>E-mail</th>
                                <th>Quantity</th>
                                <th>Total</th>
                                <th>Status</th>
                                <th>Date</th>
                                <th>Actions</th>
                            </tr>
                            </thead>
                            <tbody>
                            <tr th:each="order : ${allOrders}">
                                <td class="ps-4 fw-semibold text-muted" th:text="'#' + ${order.id}"></td>
                                <td>
                                    <span th:text="${order.user != null ? order.user.firstName + ' ' + order.user.lastName : 'Guest'}"></span>
                                </td>
                                <td class="text-muted">
                                    <span th:text="${order.user != null ? order.user.username : '-'}"></span>
                                </td>
                                <td>
                                    <span class="badge bg-light text-dark border" th:text="${order.totalQuantity} + ' pieces'"></span>
                                </td>
                                <td class="fw-semibold" th:text="${#numbers.formatDecimal(order.totalPrice, 1, 2) + '₺'}"></td>
                                <td>
                                        <span th:switch="${order.status.name()}">
                                            <span th:case="'SUCCESS'" class="badge bg-success">Success</span>
                                            <span th:case="'PENDING'" class="badge bg-warning text-dark">Pending</span>
                                            <span th:case="'FAILED'" class="badge bg-danger">Failed</span>
                                            <span th:case="'SHIPPED'"   class="badge bg-primary">Shipped</span>
                                            <span th:case="'DELIVERED'" class="badge bg-info text-dark">Delivered</span>
                                            <span th:case="'CANCELLED'" class="badge bg-secondary">Cancelled</span>
                                        </span>
                                </td>
                                <td class="text-muted" th:text="${#temporals.format(order.orderDate, 'dd.MM.yyyy HH:mm')}"></td>
                                <td>
                                    <a th:if="${order.status.name() == 'SUCCESS'}"
                                       th:href="@{'/admin/orders/' + ${order.id} + '/ship'}"
                                       class="btn btn-sm btn-dark">
                                        Ship Order
                                    </a>
                                    <form th:if="${order.status.name() == 'SHIPPED'}"
                                          th:action="@{'/admin/orders/' + ${order.id} + '/deliver'}"
                                          method="post" class="d-inline">
                                        <button type="submit" class="btn btn-sm btn-success">
                                            Mark Delivered
                                        </button>
                                    </form>
                                    <a th:if="${order.status.name() == 'DELIVERED'}"
                                       th:href="@{'/orders/' + ${order.id} + '/track'}"
                                       class="btn btn-sm btn-outline-secondary" target="_blank">
                                        View Tracking
                                    </a>

                                    <form th:if="${order.status.name() != 'DELIVERED' and order.status.name() != 'CANCELLED'}"
                                          th:action="@{/admin/orders/{id}/cancel(id=${order.id})}"
                                          method="post" class="d-inline"
                                          onsubmit="return confirm('Cancel this order?')">
                                        <button type="submit" class="btn btn-sm btn-outline-danger ms-1">Cancel</button>
                                    </form>

                                </td>
                            </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
