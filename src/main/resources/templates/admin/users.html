<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin - Users</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; }
    .sidebar { width: 280px; height: 100vh; position: fixed; left: 0; top: 0; background-color: #343a40; z-index: 1000; }
    .main-content { margin-left: 280px; padding: 40px; min-height: 100vh; }
    .card { border: none; border-radius: 12px; }
  </style>
</head>
<body>

<div th:replace="~{admin/sidebar :: adminSidebar}"></div>

<div class="main-content">
  <div class="container-fluid" style="max-width:1300px;">

    <div class="d-flex justify-content-between align-items-center mb-4">
      <h3 class="fw-bold mb-0">User Management</h3>
      <button class="btn btn-dark" data-bs-toggle="modal" data-bs-target="#addUserModal">
        + Add User
      </button>
    </div>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div th:if="${editUser != null}" class="card shadow-sm mb-4">
      <div class="card-body p-4">
        <h5 class="fw-bold mb-4">
          Edit User — <span th:text="${editUser.email}"></span>
        </h5>
        <form th:action="@{/admin/users/update/{id}(id=${editUser.id})}"
              th:object="${updateRequest}" method="post">
          <div class="row g-3">
            <div class="col-md-4">
              <label class="form-label fw-semibold">First Name</label>
              <input type="text" th:field="*{firstName}" class="form-control">
            </div>
            <div class="col-md-4">
              <label class="form-label fw-semibold">Last Name</label>
              <input type="text" th:field="*{lastName}" class="form-control">
            </div>
            <div class="col-md-4 d-flex align-items-end">
              <button type="submit" class="btn btn-dark w-100">Save Changes</button>
            </div>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm mb-4">
      <div class="card-body py-3">
        <form th:action="@{/admin/users}" method="get" class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label fw-semibold">Search</label>
            <input type="text" name="search" class="form-control"
                   placeholder="Name or email..."
                   th:value="${search}">
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold">Role</label>
            <select name="role" class="form-select">
              <option value="" th:selected="${selectedRole == ''}">All</option>
              <option value="ADMIN" th:selected="${selectedRole == 'ADMIN'}">Admin</option>
              <option value="MANAGER" th:selected="${selectedRole == 'MANAGER'}">Manager</option>
              <option value="CUSTOMER" th:selected="${selectedRole == 'CUSTOMER'}">Customer</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold">Status</label>
            <select name="status" class="form-select">
              <option value="" th:selected="${selectedStatus == ''}">All</option>
              <option value="active" th:selected="${selectedStatus == 'active'}">Active</option>
              <option value="inactive" th:selected="${selectedStatus == 'inactive'}">Inactive</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold">Sort By</label>
            <select name="sortBy" class="form-select">
              <option value="id" th:selected="${sortBy == 'id'}">ID</option>
              <option value="name" th:selected="${sortBy == 'name'}">Name</option>
            </select>
          </div>
          <div class="col-md-1">
            <label class="form-label fw-semibold">Order</label>
            <select name="direction" class="form-select">
              <option value="asc" th:selected="${direction == 'asc'}">Asc</option>
              <option value="desc" th:selected="${direction == 'desc'}">Desc</option>
            </select>
          </div>
          <div class="col-md-1">
            <button type="submit" class="btn btn-dark w-100">Filter</button>
          </div>
          <div class="col-md-1">
            <a th:href="@{/admin/users}" class="btn btn-outline-secondary w-100">Reset</a>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
              <th class="ps-4">#</th>
              <th>Name</th>
              <th>Email</th>
              <th>Role</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="user : ${users}">
              <td class="ps-4 text-muted fw-semibold" th:text="${user.id}"></td>
              <td th:text="${user.firstName + ' ' + user.lastName}"></td>
              <td class="text-muted" th:text="${user.email}"></td>
              <td>
                <span th:switch="${user.role.name()}">
                  <span th:case="'ADMIN'" class="badge bg-danger">Admin</span>
                  <span th:case="'MANAGER'" class="badge bg-primary">Manager</span>
                  <span th:case="'CUSTOMER'" class="badge bg-secondary">Customer</span>
                </span>
              </td>
              <td>
                <span th:if="${user.enabled}" class="badge bg-success">Active</span>
                <span th:if="${!user.enabled}" class="badge bg-warning text-dark">Inactive</span>
              </td>
              <td>
                <a th:href="@{/admin/users/edit/{id}(id=${user.id})}"
                   class="btn btn-sm btn-outline-dark">Edit</a>

                <form th:action="@{/admin/users/toggle/{id}(id=${user.id})}"
                      method="post" class="d-inline">
                  <button type="submit"
                          th:class="${user.enabled} ? 'btn btn-sm btn-outline-warning ms-1' : 'btn btn-sm btn-outline-success ms-1'"
                          th:text="${user.enabled} ? 'Deactivate' : 'Activate'">
                  </button>
                </form>

                <form th:action="@{/admin/users/delete/{id}(id=${user.id})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('Delete this user?')">
                  <button type="submit" class="btn btn-sm btn-outline-danger ms-1">Delete</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<div class="modal fade" id="addUserModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Add New User</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form th:action="@{/admin/users/add}" th:object="${createRequest}" method="post">
        <div class="modal-body">
          <div class="mb-3">
            <label class="form-label fw-semibold">First Name</label>
            <input type="text" th:field="*{firstName}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Last Name</label>
            <input type="text" th:field="*{lastName}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Birth Date <span class="text-muted fw-normal">(optional)</span></label>
            <input type="date" th:field="*{birthDate}" class="form-control"
                   min="1900-01-01" max="2010-12-31">
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Email</label>
            <input type="email" th:field="*{email}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Password</label>
            <input type="password" th:field="*{password}" class="form-control" required>
          </div>
          <div class="mb-3">
            <label class="form-label fw-semibold">Role</label>
            <select th:field="*{role}" class="form-select" required>
              <option value="">Select role</option>
              <option th:each="role : ${roles}"
                      th:value="${role}"
                      th:text="${role}"></option>
            </select>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-dark">Create User</button>
        </div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
