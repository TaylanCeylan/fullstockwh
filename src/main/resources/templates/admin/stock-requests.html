<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin - Stock Requests</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; }
    .sidebar { width: 280px; height: 100vh; position: fixed; left: 0; top: 0; background-color: #343a40; z-index: 1000; }
    .main-content { margin-left: 280px; padding: 40px; min-height: 100vh; }
    .card { border: none; border-radius: 12px; }
  </style>
</head>
<body>

<div th:replace="~{admin/sidebar :: adminSidebar}"></div>

<div class="main-content">
  <div class="container-fluid" style="max-width:1300px;">

    <h3 class="fw-bold mb-4">Stock Requests</h3>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div th:if="${requests == null or #lists.isEmpty(requests)}"
             class="text-center text-muted py-5">No stock requests yet.</div>
        <div th:if="${requests != null and not #lists.isEmpty(requests)}"
             class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
              <th class="ps-4">#</th>
              <th>Manager</th>
              <th>Product</th>
              <th>Variant</th>
              <th>Qty</th>
              <th>Note</th>
              <th>Status</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="req : ${requests}">
              <td class="ps-4 fw-semibold text-muted" th:text="'#' + ${req.id}"></td>
              <td th:text="${req.requestedBy.firstName + ' ' + req.requestedBy.lastName}"></td>
              <td class="fw-semibold" th:text="${req.variant.product.name}"></td>
              <td th:text="${req.variant.color} + ' / ' + ${req.variant.size}"></td>
              <td th:text="${req.requestedQuantity}"></td>
              <td class="text-muted small" th:text="${req.note != null ? req.note : '-'}"></td>
              <td>
                                <span th:switch="${req.status.name()}">
                                    <span th:case="'PENDING'" class="badge bg-warning text-dark">Pending</span>
                                    <span th:case="'APPROVED'" class="badge bg-success">Approved</span>
                                    <span th:case="'REJECTED'" class="badge bg-danger">Rejected</span>
                                </span>
              </td>
              <td class="text-muted small"
                  th:text="${#temporals.format(req.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
              <td>
                <form th:if="${req.status.name() == 'PENDING'}"
                      th:action="@{/admin/stock-requests/{id}/approve(id=${req.id})}"
                      method="post" class="d-inline">
                  <button type="submit" class="btn btn-sm btn-success">Approve</button>
                </form>
                <form th:if="${req.status.name() == 'PENDING'}"
                      th:action="@{/admin/stock-requests/{id}/reject(id=${req.id})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('Reject this request?')">
                  <button type="submit" class="btn btn-sm btn-outline-danger ms-1">Reject</button>
                </form>
                <span th:if="${req.status.name() != 'PENDING'}"
                      class="text-muted small">Resolved</span>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
