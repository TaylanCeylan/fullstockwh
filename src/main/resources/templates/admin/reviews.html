<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Admin - Reviews</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f4f7f6; }
    .sidebar { width: 280px; height: 100vh; position: fixed; left: 0; top: 0; background-color: #343a40; z-index: 1000; }
    .main-content { margin-left: 280px; padding: 40px; min-height: 100vh; }
    .card { border: none; border-radius: 12px; }
  </style>
</head>
<body>

<div th:replace="~{admin/sidebar :: adminSidebar}"></div>

<div class="main-content">
  <div class="container-fluid" style="max-width:1300px;">

    <h3 class="fw-bold mb-4">Reviews</h3>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <div class="card shadow-sm mb-4">
      <div class="card-body py-3">
        <form th:action="@{/admin/reviews}" method="get" class="row g-3 align-items-end">
          <div class="col-md-3">
            <label class="form-label fw-semibold">Search</label>
            <input type="text" name="search" class="form-control"
                   placeholder="Customer or product..."
                   th:value="${search}">
          </div>
          <div class="col-md-3">
            <label class="form-label fw-semibold">Sort By</label>
            <select name="sortBy" id="sortBySelect" class="form-select">
              <option value="date" th:selected="${sortBy == 'date'}">Date</option>
              <option value="rating" th:selected="${sortBy == 'rating'}">Rating</option>
              <option value="product" th:selected="${sortBy == 'product'}">Product</option>
              <option value="id" th:selected="${sortBy == 'id'}">ID</option>
            </select>
          </div>
          <div class="col-md-2">
            <label class="form-label fw-semibold">Order</label>
            <select name="direction" id="directionSelect" class="form-select">
              <option value="desc" th:selected="${direction == 'desc'}" id="optDesc">Newest</option>
              <option value="asc"  th:selected="${direction == 'asc'}"  id="optAsc">Oldest</option>
            </select>
          </div>
          <div class="col-md-1">
            <button type="submit" class="btn btn-dark w-100">Filter</button>
          </div>
          <div class="col-md-1">
            <a th:href="@{/admin/reviews}" class="btn btn-outline-secondary w-100">Reset</a>
          </div>
        </form>
      </div>
    </div>

    <div class="card shadow-sm">
      <div class="card-body p-0">
        <div th:if="${reviews == null or #lists.isEmpty(reviews)}"
             class="text-center text-muted py-5">No reviews yet.</div>
        <div th:if="${reviews != null and not #lists.isEmpty(reviews)}"
             class="table-responsive">
          <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
              <th class="ps-4">#</th>
              <th>Product</th>
              <th>Customer</th>
              <th>Rating</th>
              <th>Comment</th>
              <th>Date</th>
              <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="review : ${reviews}">
              <td class="ps-4 text-muted fw-semibold" th:text="${review.id}"></td>
              <td class="fw-semibold" th:text="${review.productName}"></td>
              <td th:text="${review.userFullName}"></td>
              <td>
                                <span th:each="i : ${#numbers.sequence(1,5)}"
                                      th:classappend="${i <= review.rating} ? 'text-warning' : 'text-muted'"
                                      style="font-size:1rem;">★</span>
                <span class="text-muted small" th:text="${review.rating} + '/5'"></span>
              </td>
              <td class="text-muted small"
                  th:text="${review.comment != null ? review.comment : '-'}"></td>
              <td class="text-muted small"
                  th:text="${#temporals.format(review.createdAt, 'dd.MM.yyyy HH:mm')}"></td>
              <td>
                <form th:action="@{/admin/reviews/{id}/delete(id=${review.id})}"
                      method="post" class="d-inline"
                      onsubmit="return confirm('Delete this review?')">
                  <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                </form>
              </td>
            </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
  const currentSortBy = /*[[${sortBy}]]*/ 'date';
  const currentDirection = /*[[${direction}]]*/ 'desc';

  const sortLabels = {
      date:{ desc: 'Newest', asc: 'Oldest' },
      rating:{ desc: 'Best First', asc: 'Worst First' },
      product:{ desc: 'Z → A', asc: 'A → Z' },
      id:{ desc: 'Desc', asc: 'Asc' }
  };

  const sortSelect = document.getElementById('sortBySelect');
  const dirSelect = document.getElementById('directionSelect');
  const dirDesc = document.getElementById('optDesc');
  const dirAsc = document.getElementById('optAsc');

  function updateDirectionLabels(sort) {
      const labels = sortLabels[sort] || sortLabels.date;
      const currentVal = dirSelect.value;
      dirDesc.textContent = labels.desc;
      dirAsc.textContent = labels.asc;
      dirSelect.value = currentVal;
  }

  sortSelect.addEventListener('change', function() {
      updateDirectionLabels(this.value);
  });

  updateDirectionLabels(currentSortBy);
  dirSelect.value = currentDirection;
</script>
</body>
</html>
