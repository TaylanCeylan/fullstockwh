<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>My Addresses - Fullstockwh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <style>
        body { background-color: #f4f7f6; }
        .profile-card {
            border: none;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            background-color: #ffffff;
        }
        .form-label { font-weight: 600; color: #495057; }

        #map {
            height: 320px;
            border-radius: 10px;
            border: 1.5px solid #dee2e6;
            z-index: 0;
        }
        .map-hint {
            font-size: 0.78rem;
            color: #6c757d;
            margin-top: 5px;
        }
        .coord-badge {
            font-family: monospace;
            font-size: 0.82rem;
            background: #f8f9fa;
            border: 1px solid #dee2e6;
            padding: 4px 10px;
            border-radius: 6px;
            color: #495057;
        }

        .add-address-header {
            cursor: pointer;
            user-select: none;
            transition: color 0.2s ease;
        }
        .add-address-header:hover { color: #0d6efd; }

        .toggle-icon {
            transition: transform 0.3s ease;
        }
        .toggle-icon.rotated {
            transform: rotate(45deg);
        }

        #addressFormCollapse {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s ease;
        }
        #addressFormCollapse.open {
            max-height: 1200px;
        }

        .edit-form-collapse {
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.4s ease;
        }
        .edit-form-collapse.open {
            max-height: 800px;
        }
    </style>
</head>
<body>

<div th:replace="~{fragments/header :: header}"></div>

<div class="container mt-5 mb-5">
    <div class="row">

        <div class="col-md-3 mb-4">
            <div th:replace="~{user/sidebar :: userSidebar('addresses')}"></div>
        </div>

        <div class="col-md-9">


            <div th:if="${successMessage != null}"
                 class="alert alert-success alert-dismissible fade show mb-3">
                <i class="bi bi-check-circle me-2"></i>
                <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
            </div>


            <div class="card profile-card p-4 mb-4">

                <div class="d-flex align-items-center gap-2 add-address-header"
                     onclick="toggleAddressForm()">
                    <i class="bi bi-plus-circle-fill text-primary fs-5 toggle-icon"
                       id="toggleIcon"></i>
                    <h5 class="fw-bold mb-0">Add New Address</h5>
                </div>

                <div id="addressFormCollapse">
                    <hr class="mt-3 mb-4">

                    <form th:action="@{/user/addresses/add}"
                          th:object="${addressRequest}"
                          method="post">

                        <div class="row g-3 mb-3">
                            <div class="col-md-3">
                                <label class="form-label">Address Title</label>
                                <input type="text" th:field="*{addressTitle}"
                                       class="form-control"
                                       placeholder="Home, Work..." required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">City (İl)</label>
                                <input type="text" id="cityInput"
                                       th:field="*{city}"
                                       class="form-control"
                                       placeholder="Istanbul" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">District (İlçe)</label>
                                <input type="text" id="districtInput"
                                       th:field="*{district}"
                                       class="form-control"
                                       placeholder="Kadıköy" required>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Neighborhood</label>
                                <input type="text" id="neighborhoodInput"
                                       th:field="*{neighborhood}"
                                       class="form-control"
                                       placeholder="Caferağa">
                            </div>
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Full Address</label>
                                <textarea th:field="*{fullAddress}"
                                          id="fullAddressInput"
                                          class="form-control" rows="2"
                                          placeholder="Street, building no..." required>
                                </textarea>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Building / Apartment Details</label>
                                <input type="text" th:field="*{buildingDetails}"
                                       class="form-control"
                                       placeholder="Block A, No: 5, Floor: 2"
                                       required>
                                <div class="form-text text-muted">
                                    <i class="bi bi-info-circle me-1"></i>
                                    Required — enter block, floor, and apartment number.
                                </div>
                            </div>
                        </div>


                        <div class="mb-3">
                            <label class="form-label">
                                <i class="bi bi-map me-1 text-primary"></i>
                                Pick Location on Map
                            </label>
                            <div id="map"></div>
                            <p class="map-hint">
                                <i class="bi bi-info-circle me-1"></i>
                                Click anywhere on the map to drop a pin.
                                Coordinates and address fill automatically.
                            </p>
                            <div class="d-flex gap-3 mt-2"
                                 id="coordDisplay"
                                 style="display:none!important;">
                                <span class="coord-badge">
                                    Lat: <span id="latDisplay">—</span>
                                </span>
                                <span class="coord-badge">
                                    Lng: <span id="lngDisplay">—</span>
                                </span>
                            </div>
                        </div>

                        <input type="hidden" th:field="*{latitude}"  id="latInput">
                        <input type="hidden" th:field="*{longitude}" id="lngInput">

                        <div class="text-end mt-3">
                            <button type="submit" class="btn btn-dark px-5">
                                <i class="bi bi-save me-2"></i>Save Address
                            </button>
                        </div>

                    </form>
                </div>
            </div>


            <h5 class="fw-bold mb-3">
                <i class="bi bi-geo-alt me-2"></i>Saved Addresses
            </h5>


            <div th:if="${addresses.isEmpty()}"
                 class="card profile-card p-5 text-center text-muted">
                <i class="bi bi-geo-alt display-4 mb-3"></i>
                <p class="mb-0">No addresses saved yet.</p>
            </div>


            <div th:each="addr : ${addresses}"
                 class="card profile-card p-4 mb-3">


                <div class="d-flex justify-content-between align-items-start">
                    <div>
                        <h6 class="fw-bold mb-1">
                            <i class="bi bi-geo-alt-fill text-danger me-2"></i>
                            <span th:text="${addr.addressTitle}">Home</span>
                        </h6>
                        <p class="mb-1 text-muted small"
                           th:text="${addr.fullAddress}"></p>
                        <p class="mb-0 text-muted small"
                           th:if="${addr.buildingDetails != null}">
                            <i class="bi bi-building me-1"></i>
                            <span th:text="${addr.buildingDetails}"></span>
                        </p>
                        <p class="mb-0 text-muted small">
                            <span th:text="${addr.neighborhood}"></span>
                            <span th:if="${addr.neighborhood != null}">, </span>
                            <span th:text="${addr.district}"></span>,
                            <span th:text="${addr.city}"></span>
                        </p>
                        <div th:if="${addr.latitude != null}"
                             class="d-flex gap-2 mt-2">
                            <span class="coord-badge">
                                <span th:text="${addr.latitude}"></span>,
                                <span th:text="${addr.longitude}"></span>
                            </span>
                        </div>
                    </div>


                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-secondary btn-sm"
                                th:onclick="'toggleEdit(' + ${addr.id} + ')'">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <form th:action="@{/user/addresses/delete/{id}(id=${addr.id})}"
                              method="post"
                              onsubmit="return confirm('Delete this address?')">
                            <button type="submit" class="btn btn-outline-danger btn-sm">
                                <i class="bi bi-trash"></i>
                            </button>
                        </form>
                    </div>
                </div>


                <div th:id="'edit-' + ${addr.id}"
                     class="edit-form-collapse">
                    <hr class="mt-3 mb-3">
                    <form th:action="@{/user/addresses/update/{id}(id=${addr.id})}"
                          method="post">
                        <div class="row g-2">
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">Address Title</label>
                                <input type="text" name="addressTitle"
                                       th:value="${addr.addressTitle}"
                                       class="form-control form-control-sm"
                                       placeholder="Home, Work..." required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-semibold small">City</label>
                                <input type="text" name="city"
                                       th:value="${addr.city}"
                                       class="form-control form-control-sm" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold small">District</label>
                                <input type="text" name="district"
                                       th:value="${addr.district}"
                                       class="form-control form-control-sm" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold small">Neighborhood</label>
                                <input type="text" name="neighborhood"
                                       th:value="${addr.neighborhood}"
                                       class="form-control form-control-sm">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label fw-semibold small">Building Details</label>
                                <input type="text" name="buildingDetails"
                                       th:value="${addr.buildingDetails}"
                                       class="form-control form-control-sm">
                            </div>
                            <div class="col-12">
                                <label class="form-label fw-semibold small">Full Address</label>
                                <textarea name="fullAddress"
                                          class="form-control form-control-sm"
                                          rows="2"
                                          th:text="${addr.fullAddress}"></textarea>
                            </div>
                            <div class="col-12 d-flex justify-content-end gap-2 mt-1">
                                <button type="button"
                                        class="btn btn-outline-secondary btn-sm"
                                        th:onclick="'toggleEdit(' + ${addr.id} + ')'">
                                    Cancel
                                </button>
                                <button type="submit" class="btn btn-dark btn-sm">
                                    <i class="bi bi-check-lg me-1"></i>Save Changes
                                </button>
                            </div>
                        </div>
                    </form>
                </div>

            </div>

        </div>
    </div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>

    let formOpen = false;
    let mapInitialized = false;
    let map, marker;

    function toggleAddressForm() {
        const collapse = document.getElementById('addressFormCollapse');
        const icon = document.getElementById('toggleIcon');

        formOpen = !formOpen;
        collapse.classList.toggle('open', formOpen);
        icon.classList.toggle('rotated', formOpen);

        if (formOpen && !mapInitialized) {
            initMap();
            mapInitialized = true;
        }
    }


    function toggleEdit(id) {
        const form = document.getElementById('edit-' + id);
        form.classList.toggle('open');
    }


    function initMap() {
        map = L.map('map').setView([41.0082, 28.9784], 12);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/">OpenStreetMap</a> contributors'
        }).addTo(map);

        map.on('click', function (e) {
            const lat = e.latlng.lat.toFixed(6);
            const lng = e.latlng.lng.toFixed(6);

            if (marker) {
                marker.setLatLng(e.latlng);
            } else {
                marker = L.marker(e.latlng).addTo(map);
            }

            document.getElementById('latInput').value = lat;
            document.getElementById('lngInput').value = lng;
            document.getElementById('latDisplay').textContent = lat;
            document.getElementById('lngDisplay').textContent = lng;
            document.getElementById('coordDisplay').style.display = 'flex';

            document.getElementById('cityInput').value = 'Loading...';
            document.getElementById('districtInput').value = 'Loading...';
            document.getElementById('neighborhoodInput').value = 'Loading...';
            document.getElementById('fullAddressInput').value = 'Loading...';

            fetch('https://nominatim.openstreetmap.org/reverse?lat='
                  + lat + '&lon=' + lng + '&format=json')
                .then(function(res) { return res.json(); })
                .then(function(data) {
                    const addr = data.address || {};

                    document.getElementById('cityInput').value =
                        addr.province || addr.state || addr.city || '';

                    document.getElementById('districtInput').value =
                        addr.city_district || addr.town || addr.county || '';

                    document.getElementById('neighborhoodInput').value =
                        addr.suburb || addr.neighbourhood || addr.quarter || '';

                    document.getElementById('fullAddressInput').value =
                        data.display_name || '';

                    marker.bindPopup(data.display_name || lat + ', ' + lng)
                          .openPopup();
                })
                .catch(function() {
                    document.getElementById('cityInput').value = '';
                    document.getElementById('districtInput').value = '';
                    document.getElementById('neighborhoodInput').value = '';
                    document.getElementById('fullAddressInput').value = '';
                    marker.bindPopup(lat + ', ' + lng).openPopup();
                });
        });
    }
</script>
</body>
</html>
